<div class="login-dark-bg min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800 relative overflow-hidden">

  <!-- ============ NEW: Decorative floating-squares backdrop (login-backdrop in login.css) ============ -->
  <div class="login-backdrop" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
  <!-- ============ END NEW BACKDROP ============ -->

  <!-- Main Card (unchanged, wrapped with relative z-10 so it sits above the backdrop) -->
  <div class="relative z-10 w-full max-w-105 bg-white rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden flex flex-col">
    
    <!-- Top Gradient Bar (Blue and Red) -->
    <div class="h-1.5 w-full bg-linear-to-r from-red-600 via-rose-500 to-blue-800"></div>

    <!-- Header / Logo -->
    <div class="pt-8 pb-4 px-8 text-center flex flex-col items-center">
      <div class="w-16 h-16 bg-linear-to-tr from-blue-900 to-blue-700 rounded-2xl flex items-center justify-center mb-3 shadow-lg text-white ring-4 ring-blue-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">VCMAS</h1>
      <p class="text-xs font-medium text-slate-500 mt-1">Veterinary Clinic Management and Appointment System</p>
    </div>

    <!-- Form with Submission Binding -->
    <form (ngSubmit)="onSignIn()" class="px-8 pb-8 pt-2 flex-1 flex flex-col space-y-4">
      
      <!-- Email or Username Input -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email or Username</label>
        <div class="relative flex items-center">
          <span class="absolute left-3.5 text-slate-400 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </span>
          <input type="text" placeholder="Email or Username" 
                 class="w-full pl-10 pr-4 py-2.5 bg-slate-100 border border-transparent rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-600 transition-all duration-200" />
        </div>
      </div>

      <!-- Password Input with Dynamic Visibility -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-xs font-semibold text-slate-700">Password</label>
          <a href="#" class="text-xs font-semibold text-blue-600 hover:text-blue-700 transition-colors">Forgot Password?</a>
        </div>
        <div class="relative flex items-center">
          <span class="absolute left-3.5 text-slate-400 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
          <!-- Dynamic Input Type -->
          <input [type]="showPassword ? 'text' : 'password'" 
                 placeholder="Password"
                 class="w-full pl-10 pr-10 py-2.5 bg-slate-100 border border-transparent rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-600 transition-all duration-200" />
          
          <!-- Eye Icon Toggle Button -->
          <button type="button" 
                  (click)="togglePasswordVisibility()" 
                  class="absolute right-3.5 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer">
            <!-- Eye (Show Password) -->
            @if (!showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            }
            <!-- Eye Off / Slash (Hide Password) -->
            @else {
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.02 10.02 0 013.682-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-6.165-3.165a3 3 0 004.243-4.243M3 3l18 18" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Remember Checkbox -->
      <div class="flex items-center pt-1">
        <input id="remember" type="checkbox" class="h-4 w-4 text-blue-700 focus:ring-blue-500 border-slate-300 rounded cursor-pointer" />
        <label for="remember" class="ml-2.5 text-xs font-medium text-slate-600 select-none cursor-pointer">Remember this device</label>
      </div>

      <!-- Sign In Button -->
      <button type="button" (click)="onSignIn()" class="mt-2 w-full py-3 px-4 bg-[#0a3a8a] hover:bg-[#072d6b] text-white font-semibold text-sm rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer">
        <span>Sign In</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </form>

    <!-- Footer Bar inside card -->
    <div class="bg-slate-50 border-t border-slate-100 py-3 text-center flex items-center justify-center gap-1.5 text-slate-500 text-xs font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
      <span>Secure Connection</span>
    </div>
  </div>

  <!-- Bottom Version Info -->
  <div class="relative z-10 mt-6 text-center text-slate-300 text-[11px] max-w-xs leading-relaxed">
    <p>VCMAS v0.1.1</p>
    <p class="mt-0.5">Beta testing only. Authorized personnel access.</p>
  </div>
</div>
